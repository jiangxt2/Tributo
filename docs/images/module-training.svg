<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#2D1B69"/>
      <stop offset="100%" stop-color="#1A0F3C"/>
    </radialGradient>
    <filter id="glowSm">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowMd">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Grid -->
  <g opacity="0.05" stroke="white" stroke-width="0.3">
    <line x1="0" y1="32" x2="64" y2="32"/><line x1="32" y1="0" x2="32" y2="64"/>
  </g>
  <!-- Neon trend line -->
  <polyline points="10,44 24,32 34,38 52,14"
            fill="none" stroke="#A78BFA" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowSm)"/>
  <polyline points="10,44 24,32 34,38 52,14"
            fill="none" stroke="white" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  <!-- Endpoint glow -->
  <circle cx="52" cy="14" r="3" fill="#C084FC" filter="url(#glowMd)" opacity="0.9"/>
  <circle cx="52" cy="14" r="1.5" fill="white" opacity="0.8"/>
  <!-- Data point dots -->
  <circle cx="24" cy="32" r="2" fill="#7C3AED" opacity="0.8"/>
  <circle cx="34" cy="38" r="2" fill="#7C3AED" opacity="0.8"/>
</svg>
