<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#2D1B69"/>
      <stop offset="100%" stop-color="#1A0F3C"/>
    </radialGradient>
    <filter id="glowSm">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowMd">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#bg)"/>
  <g opacity="0.05" stroke="white" stroke-width="0.3">
    <line x1="0" y1="32" x2="64" y2="32"/><line x1="32" y1="0" x2="32" y2="64"/>
  </g>
  <!-- Connection lines -->
  <g stroke="#7C3AED" stroke-width="1.5" opacity="0.4">
    <line x1="20" y1="22" x2="28" y2="40"/>
    <line x1="44" y1="22" x2="36" y2="40"/>
    <line x1="20" y1="20" x2="44" y2="20"/>
  </g>
  <!-- Nodes with glow -->
  <circle cx="18" cy="20" r="4.5" fill="#A78BFA" opacity="0.9" filter="url(#glowSm)"/>
  <circle cx="18" cy="20" r="2" fill="white" opacity="0.5"/>
  <circle cx="46" cy="20" r="4.5" fill="#C084FC" opacity="0.9" filter="url(#glowSm)"/>
  <circle cx="46" cy="20" r="2" fill="white" opacity="0.5"/>
  <circle cx="32" cy="44" r="4.5" fill="#00F0FF" opacity="0.9" filter="url(#glowMd)"/>
  <circle cx="32" cy="44" r="2" fill="white" opacity="0.6"/>
</svg>
