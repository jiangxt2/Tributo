<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#0A2E25"/>
      <stop offset="100%" stop-color="#051712"/>
    </radialGradient>
    <filter id="glowSm">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowMd">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#bg)"/>
  <g opacity="0.05" stroke="white" stroke-width="0.3">
    <line x1="0" y1="32" x2="64" y2="32"/><line x1="32" y1="0" x2="32" y2="64"/>
  </g>
  <!-- Server rack -->
  <rect x="14" y="12" width="36" height="11" rx="2" fill="#10B981" opacity="0.15" stroke="#34D399" stroke-width="0.8" filter="url(#glowSm)"/>
  <circle cx="21" cy="17.5" r="2" fill="#34D399" filter="url(#glowSm)"/>
  <rect x="27" y="14" width="18" height="3" rx="1" fill="#34D399" opacity="0.3"/>
  <rect x="27" y="18" width="12" height="2" rx="1" fill="#34D399" opacity="0.15"/>

  <rect x="14" y="27" width="36" height="11" rx="2" fill="#10B981" opacity="0.1" stroke="#34D399" stroke-width="0.6" opacity="0.6"/>
  <circle cx="21" cy="32.5" r="2" fill="#34D399" opacity="0.7"/>
  <rect x="27" y="29" width="18" height="3" rx="1" fill="#34D399" opacity="0.2"/>
  <rect x="27" y="33" width="12" height="2" rx="1" fill="#34D399" opacity="0.1"/>

  <rect x="14" y="42" width="36" height="11" rx="2" fill="#10B981" opacity="0.06" stroke="#34D399" stroke-width="0.5" opacity="0.35"/>
  <circle cx="21" cy="47.5" r="2" fill="#34D399" opacity="0.45"/>
  <rect x="27" y="44" width="18" height="3" rx="1" fill="#34D399" opacity="0.12"/>
  <rect x="27" y="48" width="12" height="2" rx="1" fill="#34D399" opacity="0.06"/>
</svg>
