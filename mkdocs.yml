site_name: Tributo
site_description: Telecom-native ML framework for Ray clusters — PU Learning, distributed training, batch embedding, and ONNX serving
site_author: Tributo Maintainers
repo_url: https://github.com/jiangxt2/tributo
repo_name: tributo
edit_uri: edit/master/docs/

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
            show_root_heading: true
            show_category_heading: true
            members_order: source

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - How-to Guides:
      - Distributed Training: how-to/training.md
      - Batch Embedding: how-to/embeddings.md
      - ONNX Serving: how-to/serving.md
      - Batch Inference: how-to/inference.md
      - PU Learning: how-to/pu-learning.md
  - CLI Reference: cli.md
  - API Reference: api.md
