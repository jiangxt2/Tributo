[project]
name = "tributo"
version = "1.0.0"
description = "Telecom-native ML framework: PU Learning, behavioral sequence pre-training, and billion-scale look-alike on Ray"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "Apache-2.0" }
authors = [
    { name = "Tributo Contributors" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "requests>=2.33.0",
    "aiohttp>=3.13.4",
    "ray[default,serve,tune]>=2.9.0,<3.0.0",
    "pydantic>=2.0.0",
    "click>=8.0.0",
    "pyyaml>=6.0.0",
    "onnxruntime>=1.20.0",
    "s3fs>=2026.2.0",
    "pyarrow>=15.0.0",
    "pandas>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/jiangxt2/tributo"
Documentation = "https://github.com/jiangxt2/tributo"
Repository = "https://github.com/jiangxt2/tributo"
Issues = "https://github.com/jiangxt2/tributo/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-timeout>=2.1.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
    "types-PyYAML>=6.0.12.20250516",
    "pandas-stubs~=2.1.4",
]
data = [
    "pylance>=4.0.0",
    "pyiceberg>=0.8.0",
]
clickhouse = [
    "clickhouse-connect>=1.3.0",
]
training = [
    "tributo[clickhouse,data]",
    "xgboost>=2.1.0",
    "daft>=0.4.0",
    "onnxmltools>=1.13.0",
    "skl2onnx>=1.17.0",
]
embeddings = [
    "tributo[data]",
    "transformers>=4.40.0",
    "optimum[onnxruntime]>=1.20.0",
    "tokenizers>=0.19.0",
    "daft>=0.4.0",
]
identity = [
    "tributo[data]",
    "torch>=2.0.0",
    "onnxruntime>=1.20.0",
    "onnxscript>=0.1.0",
]
streaming = [
    "tributo[embeddings]",
    "accelerate>=0.20.0",
]
grpc = [
    "grpcio>=1.60.0",
]
registry = [
    "mlflow>=2.18.0,<4.0.0",
]
test-integration = [
    "tributo[training]",
    "pytest>=7.0.0",
    "requests>=2.25.0",
]

[project.scripts]
tributo = "tributo.cli:main"

[project.entry-points."tributo.connectors"]
parquet = "tributo.data.parquet:ParquetDataConnector"

[project.entry-points."tributo.trainers"]
xgboost = "tributo.training.xgboost_trainer"
pu = "tributo.training.pu_trainer"

[project.entry-points."tributo.models"]
bge_small_zh = "tributo.embeddings.registry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
extend-exclude = [
    "jobs/",
    "scripts/",
    "src/tributo/serving/proto/generated/",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "Q", "C4", "W"]
ignore = ["E501", "B008", "B905"]

[tool.ruff.lint.isort]
known-first-party = ["tributo"]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
timeout = 180
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "s3: marks tests that require real S3 access (deselect with '-m \"not s3\"')",
    "integration: marks tests that require MLflow server (deselect with '-m \"not integration\"')",
]
addopts = "-m 'not slow'"

[tool.coverage.run]
source = ["src/tributo"]
branch = true
relative_files = true

[tool.coverage.report]
exclude_also = [
    'def __repr__',
    'def __str__',
    'if self\.debug:',
    'if settings\.DEBUG',
    'raise AssertionError',
    'raise NotImplementedError',
    'if 0:',
    'if __name__ == .__main__.:',
    'if TYPE_CHECKING:',
    'class .*\bProtocol\):',
    '@(abc\.)?abstractmethod',
]
show_missing = true
skip_covered = false

[tool.coverage.xml]
output = "coverage.xml"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["src/tributo/serving/proto/generated/"]

[[tool.mypy.overrides]]
module = "tributo.cli"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# Modules whose remaining type errors come from incomplete stubs in
# upstream libraries (Ray, numpy, MLflow, Click, grpcio).  Ignore those
# errors so that mypy stays useful for the rest of the codebase.
module = [
    "tributo._common.serve_utils",
    "tributo.data.iceberg",
    "tributo.serving.composition",
    "tributo.serving.grpc_deployment",
    "tributo.serving.identity_predictor",
    "tributo.serving.streaming_deployment",
    "tributo.training.dnn_trainer",
    "tributo.training.models.dnn",
    "tributo.training.pu_metrics",
    "tributo.training.pu_trainer",
]
ignore_errors = true

[[tool.mypy.overrides]]
# Modules with only no-any-return / no-untyped-def from external deps.
module = [
    "tributo.data.lance",
    "tributo.inference.pipeline",
    "tributo.registry.mlflow_util",
    "tributo.training.local_runner",
    "tributo.training.priors",
    "tributo.training.tune_runner",
]
warn_return_any = false
disallow_untyped_defs = false

[dependency-groups]
dev = [
    "pytest-html>=4.2.0",
    "grpcio-tools>=1.60.0",
    "boto3>=1.42.91",
    "pytest>=9.0.2",
    "pytest-timeout>=2.4.0",
    "pytest-asyncio>=1.3.0",
    "pytest-metadata>=3.1.1",
    "redis>=8.0.0",
    "clickhouse-connect>=1.3.0",
]
