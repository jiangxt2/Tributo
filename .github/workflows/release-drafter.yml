name: Release Drafter

on:
  push:
    branches: [master]
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  update-draft-release:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@c03148ea43699a98f338dbb64b0d4dd5b07ae447
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
