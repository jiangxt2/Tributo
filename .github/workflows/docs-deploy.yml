name: Deploy Docs

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "src/tributo/**/*.py"
      - ".github/workflows/docs-deploy.yml"
      - ".readthedocs.yaml"
      - "Makefile"
      - "pyproject.toml"
      - "requirements-doc.in"
      - "requirements-doc.lock"
      - "tools/check_docs.py"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - uses: astral-sh/setup-uv@d269b9917d8e33f7165632f15cc38a13726f64b5
        with:
          python-version: "3.12"

      - name: Install spelling system dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes enchant-2

      - name: Install docs dependencies
        run: |
          uv venv .docs-venv --python 3.12
          uv pip install \
            --python .docs-venv/bin/python \
            --requirement requirements-doc.lock

      - name: Check documentation contracts
        run: .docs-venv/bin/python tools/check_docs.py --static-only

      - name: Build strict Sphinx site
        run: make strict SPHINXBUILD=.docs-venv/bin/sphinx-build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@98ef48e41587a300b82de4cf298aa98b57b2faae
        with:
          path: docs/_build/html/

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
