name: PR Test Suite

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  merge_group:
    types: [checks_requested]

concurrency:
  group: pr-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-plan:
    name: Test Impact Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_unit: ${{ steps.plan.outputs.run_unit }}
      run_docs: ${{ steps.plan.outputs.run_docs }}
      run_matrix: ${{ steps.plan.outputs.run_matrix }}
      matrix: ${{ steps.plan.outputs.matrix }}
      manual_count: ${{ steps.plan.outputs.manual_count }}
      quarantine_count: ${{ steps.plan.outputs.quarantine_count }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0

      - name: Audit declarative test policy
        run: python3 scripts/ci_test_plan.py audit

      - name: Build CI-safe matrix and external validation report
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          PLAN_JSON: ${{ runner.temp }}/tributo-ci-test-plan.json
        run: >-
          python3 scripts/ci_test_plan.py plan
          --event "$EVENT_NAME"
          --mode pr
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --github-output "$GITHUB_OUTPUT"
          --summary "$GITHUB_STEP_SUMMARY"
          --json-output "$PLAN_JSON"

      - name: Upload test impact plan
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test-impact-plan
          path: ${{ runner.temp }}/tributo-ci-test-plan.json
          if-no-files-found: error
          retention-days: 7


  dco:
    name: DCO Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    env:
      EVENT_NAME: ${{ github.event_name }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0

      - name: Check Signed-off-by
        run: |
          if [ "$EVENT_NAME" = "merge_group" ]; then
            echo "DCO was validated on pull_request before queue admission"
            exit 0
          fi

          git fetch origin "$BASE_SHA"
          FAIL=0
          COMMITS=$(git log --format='%H' "$BASE_SHA..$HEAD_SHA")
          for commit in $COMMITS; do
            if ! git log -1 --format='%B' "$commit" | grep -qE "^Signed-off-by: [^<]+ <[^>]+>$"; then
              echo "Commit $commit is missing Signed-off-by"
              FAIL=1
            fi
          done
          if [ "$FAIL" -eq 1 ]; then
            echo "All commits must have a Signed-off-by line."
            exit 1
          fi
          echo "All commits have Signed-off-by"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test-plan
    if: needs.test-plan.outputs.run_unit == 'true'
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - uses: astral-sh/setup-uv@cd13f9217092d43a771cf9ba7b09bdd3da8d7c4d
        with:
          python-version: "3.12"

      - name: Check lockfile freshness
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --extra dev --locked

      - name: Lint
        run: >-
          uv run --locked --no-sync ruff check
          src/ tests/ tools/ scripts/ci_test_plan.py scripts/pr-precheck.py
          docs/conf.py docs/_ext/

      - name: Format check
        run: >-
          uv run --locked --no-sync ruff format --check
          src/ tests/ tools/ scripts/ci_test_plan.py scripts/pr-precheck.py
          docs/conf.py docs/_ext/

      - name: Type check
        run: uv run --locked --no-sync mypy src/tributo

      - name: Check public API annotations
        run: uv run --locked --no-sync python tools/check_public_api_annotations.py

      - name: Verify generated protobuf sources
        run: |
          proto_check_dir="$(mktemp -d)"
          PROTO_OUTPUT_DIR="$proto_check_dir" \
            bash src/tributo/serving/proto/compile.sh
          diff -u \
            src/tributo/serving/proto/inference_pb2.py \
            "$proto_check_dir/tributo/serving/proto/inference_pb2.py"
          diff -u \
            src/tributo/serving/proto/inference_pb2_grpc.py \
            "$proto_check_dir/tributo/serving/proto/inference_pb2_grpc.py"

  unit-tests:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [test-plan, lint]
    if: needs.test-plan.outputs.run_unit == 'true'
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - uses: astral-sh/setup-uv@cd13f9217092d43a771cf9ba7b09bdd3da8d7c4d
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run manifest-owned unit suite
        # The runner applies every manifest-owned marker exclusion.
        run: python3 scripts/ci_test_plan.py run --suite unit --prepare

  ci-safe-integration:
    name: CI-safe integration (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test-plan
    if: needs.test-plan.outputs.run_matrix == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.test-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - uses: astral-sh/setup-uv@cd13f9217092d43a771cf9ba7b09bdd3da8d7c4d
        with:
          python-version: "3.12"

      - name: Run budgeted manifest suite
        run: >-
          python3 scripts/ci_test_plan.py run
          --suite "${{ matrix.suite }}"
          --prepare

  docs-build:
    name: Documentation Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test-plan
    if: needs.test-plan.outputs.run_docs == 'true'
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - uses: astral-sh/setup-uv@cd13f9217092d43a771cf9ba7b09bdd3da8d7c4d
        with:
          python-version: "3.12"

      - name: Install spelling system dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes enchant-2

      - name: Install locked documentation dependencies
        run: |
          uv venv .docs-venv --python 3.12
          uv pip install \
            --python .docs-venv/bin/python \
            --requirement requirements-doc.lock

      - name: Verify README examples
        run: python3 scripts/verify_readme_examples.py

      - name: Check static documentation contracts
        run: .docs-venv/bin/python tools/check_docs.py --static-only

      - name: Build strict documentation
        run: make strict SPHINXBUILD=.docs-venv/bin/sphinx-build

      - name: Check spelling
        run: make spelling SPHINXBUILD=.docs-venv/bin/sphinx-build

      - name: Upload documentation preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: documentation-html
          path: docs/_build/html/
          retention-days: 7

  docs-api-it:
    name: Documentation API Integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [test-plan, docs-build]
    if: needs.test-plan.outputs.run_docs == 'true'
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - uses: astral-sh/setup-uv@cd13f9217092d43a771cf9ba7b09bdd3da8d7c4d
        with:
          python-version: "3.12"

      - name: Install spelling system dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes enchant-2

      - name: Install real runtime and documentation dependencies
        run: |
          uv sync \
            --extra dev \
            --extra grpc \
            --extra training \
            --extra vector-index \
            --locked
          uv pip install \
            --python .venv/bin/python \
            --requirement requirements-doc.lock

      - name: Build documentation without mocks
        env:
          SPHINX_REAL_IMPORTS: "1"
        run: |
          make strict \
            SPHINXBUILD=.venv/bin/sphinx-build \
            BUILDDIR=docs/_build-real \
            HTMLDIR=docs/_build-real/html

      - name: Run documentation API integration tests
        run: |
          .venv/bin/python tools/generate_algorithm_support_matrix.py --check
          .venv/bin/python tools/generate_public_api_reference.py --check
          python3 scripts/ci_test_plan.py run --suite documentation-api


  docs-linkcheck:
    name: Documentation External Links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    needs: [test-plan, docs-build]
    if: needs.test-plan.outputs.run_docs == 'true'
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - uses: astral-sh/setup-uv@cd13f9217092d43a771cf9ba7b09bdd3da8d7c4d
        with:
          python-version: "3.12"

      - name: Install documentation dependencies
        run: |
          uv venv .docs-venv --python 3.12
          uv pip install \
            --python .docs-venv/bin/python \
            --requirement requirements-doc.lock

      - name: Check external links
        run: make linkcheck SPHINXBUILD=.docs-venv/bin/sphinx-build

  build:
    name: Package Build & Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test-plan, lint]
    if: needs.test-plan.outputs.run_unit == 'true'
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - uses: astral-sh/setup-uv@cd13f9217092d43a771cf9ba7b09bdd3da8d7c4d
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: uv build

      - name: Smoke test
        run: |
          uv venv /tmp/smoke-venv --python 3.12
          uv pip install --python /tmp/smoke-venv/bin/python dist/*.whl
          /tmp/smoke-venv/bin/tributo --help

  # DCO remains an independent required Ruleset check. This gate owns only
  # the test-plan-dependent jobs whose skipped/success states it evaluates.
  core-gate:
    name: core-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - test-plan
      - lint
      - unit-tests
      - ci-safe-integration
      - docs-build
      - docs-api-it
      - build
    steps:
      - name: Validate required job outcomes
        env:
          PLAN_RESULT: ${{ needs.test-plan.result }}
          RUN_UNIT: ${{ needs.test-plan.outputs.run_unit }}
          RUN_DOCS: ${{ needs.test-plan.outputs.run_docs }}
          LINT_RESULT: ${{ needs.lint.result }}
          UNIT_RESULT: ${{ needs.unit-tests.result }}
          CI_SAFE_RESULT: ${{ needs.ci-safe-integration.result }}
          DOCS_BUILD_RESULT: ${{ needs.docs-build.result }}
          DOCS_API_RESULT: ${{ needs.docs-api-it.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          set -eu

          fail() {
            echo "core-gate: $1" >&2
            exit 1
          }

          require_success() {
            name="$1"
            result="$2"
            [ "$result" = "success" ] || fail "$name finished with $result"
          }

          require_skipped() {
            name="$1"
            result="$2"
            [ "$result" = "skipped" ] || fail "$name was expected to skip but finished with $result"
          }

          require_success test-plan "$PLAN_RESULT"
          require_success ci-safe-integration "$CI_SAFE_RESULT"

          if [ "$RUN_UNIT" = "true" ]; then
            require_success lint "$LINT_RESULT"
            require_success unit-tests "$UNIT_RESULT"
            require_success build "$BUILD_RESULT"
          else
            require_skipped lint "$LINT_RESULT"
            require_skipped unit-tests "$UNIT_RESULT"
            require_skipped build "$BUILD_RESULT"
          fi

          if [ "$RUN_DOCS" = "true" ]; then
            require_success docs-build "$DOCS_BUILD_RESULT"
            require_success docs-api-it "$DOCS_API_RESULT"
          else
            require_skipped docs-build "$DOCS_BUILD_RESULT"
            require_skipped docs-api-it "$DOCS_API_RESULT"
          fi

          echo "core-gate: all applicable CI-safe jobs completed successfully"
