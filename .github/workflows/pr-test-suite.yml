name: PR Test Suite

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  dco:
    name: DCO Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0
      - name: Check Signed-off-by
        run: |
          git fetch origin "${{ github.event.pull_request.base.sha }}"
          FAIL=0
          for commit in $(git log --format='%H' "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"); do
            if ! git log -1 --format='%B' "$commit" | grep -q "^Signed-off-by:"; then
              echo "❌ Commit $commit is missing Signed-off-by"
              FAIL=1
            fi
          done
          if [ "$FAIL" -eq 1 ]; then
            echo ""
            echo "All commits must have a Signed-off-by line."
            echo "Run: git commit --amend -s"
            echo "Or set up the auto-signoff hook: cp scripts/prepare-commit-msg .git/hooks/"
            exit 1
          fi
          echo "✅ All commits have Signed-off-by"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - uses: astral-sh/setup-uv@d269b9917d8e33f7165632f15cc38a13726f64b5

      - name: Lint (ruff)
        run: uvx ruff check src/ tests/

      - name: Format check (ruff)
        run: uvx ruff format --check src/ tests/

  unit-tests:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - uses: astral-sh/setup-uv@d269b9917d8e33f7165632f15cc38a13726f64b5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Type check (mypy)
        run: uv run mypy src/tributo

      - name: Verify README examples
        run: uv run python scripts/verify_readme_examples.py

      - name: Check public API annotations
        run: uv run python tools/check_public_api_annotations.py

      - name: Run unit tests
        run: |
          uv run python -m pytest tests/ \
            -m "not integration and not slow and not s3" \
            -v --tb=short --timeout=180

  build:
    name: Package Build & Smoke Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - uses: astral-sh/setup-uv@d269b9917d8e33f7165632f15cc38a13726f64b5
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: uv build

      - name: Smoke test (wheel)
        run: |
          uv venv /tmp/smoke-venv --python 3.12
          uv pip install --python /tmp/smoke-venv/bin/python dist/*.whl
          /tmp/smoke-venv/bin/tributo --help

      - name: Smoke test (sdist)
        run: |
          uv venv /tmp/smoke-sdist --python 3.12
          uv pip install --python /tmp/smoke-sdist/bin/python dist/*.tar.gz
          /tmp/smoke-sdist/bin/python -c "import tributo; print(tributo.__version__)"
