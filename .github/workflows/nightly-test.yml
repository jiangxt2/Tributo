name: Nightly Test

on:
  schedule:
    - cron: "37 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-plan:
    name: Scheduled Test Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_matrix: ${{ steps.plan.outputs.run_matrix }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Audit declarative test policy
        run: python3 scripts/ci_test_plan.py audit

      - name: Build budgeted nightly matrix
        id: plan
        run: >-
          python3 scripts/ci_test_plan.py plan
          --event "$GITHUB_EVENT_NAME"
          --mode scheduled
          --github-output "$GITHUB_OUTPUT"
          --summary "$GITHUB_STEP_SUMMARY"

  scheduled-tests:
    name: Scheduled (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test-plan
    if: needs.test-plan.outputs.run_matrix == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.test-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - uses: astral-sh/setup-uv@cd13f9217092d43a771cf9ba7b09bdd3da8d7c4d
        with:
          python-version: "3.12"

      - name: Run scheduled manifest shard
        # Each shard enforces "not manual_it" and "not quarantine" via the manifest.
        run: >-
          python3 scripts/ci_test_plan.py run
          --suite "${{ matrix.suite }}"
          --prepare

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nightly-${{ matrix.suite }}-evidence
          path: .pytest_cache/
          if-no-files-found: warn
          retention-days: 7
