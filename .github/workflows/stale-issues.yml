name: Stale Issues

on:
  schedule:
    - cron: "0 9 * * 1"  # Every Monday at 09:00 UTC
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93
        with:
          days-before-issue-stale: 90
          days-before-issue-close: 14
          stale-issue-message: >
            This issue has been marked as stale because it has been inactive
            for 90 days. It will be closed in 14 days unless there is new
            activity.
          stale-pr-message: >
            This PR has been marked as stale because it has been inactive
            for 60 days. It will be closed in 14 days unless there is new
            activity.
          days-before-pr-stale: 60
          days-before-pr-close: 14
          exempt-issue-labels: "pinned,security,rfc"
          exempt-pr-labels: "pinned,security,rfc"
