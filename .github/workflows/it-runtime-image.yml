name: IT Runtime Image

on:
  push:
    branches: [master]
    paths:
      - "tests/integrations/Dockerfile.data-ingestion"
      - "tests/integrations/Dockerfile.data-ingestion.dockerignore"
      - "tests/integrations/runtime-profiles.json"
      - "tests/integrations/component-versions.env"
      - "tools/tributo_it.py"
      - "tools/tributo-runtime-full.json"
      - "tools/runtime_image_contract.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/it-runtime-image.yml"
  workflow_dispatch:

concurrency:
  group: it-runtime-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish-data-ingestion-runtime:
    name: Publish Data Ingestion Runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: "0.11.23"
          python-version: "3.12"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        with:
          driver: docker-container

      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish immutable runtime when missing
        env:
          TRIBUTO_IT_BUILDX_CACHE_FROM: type=registry,ref=ghcr.io/jiangxt2/tributo-it-runtime:buildcache-data-ingestion
          TRIBUTO_IT_BUILDX_CACHE_TO: type=registry,ref=ghcr.io/jiangxt2/tributo-it-runtime:buildcache-data-ingestion,mode=max
        run: >-
          uv run --no-project --python 3.12 python tools/tributo_it.py publish-runtime
          --profile data-ingestion
          --platform linux/amd64
          --build-input-mode canonical
          --registry ghcr.io/jiangxt2/tributo-it-runtime
