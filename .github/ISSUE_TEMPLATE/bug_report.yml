name: Bug report
description: Report a problem with Tributo
title: "[<Tributo component: Core|Training|Data|Exporting|Registry|Inference|Serving|Integrations|CLI|Docs|etc...>] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem!
        Please provide reproducible steps. For questions or ideas, use the
        [GitHub Discussions page](https://github.com/jiangxt2/Tributo/discussions).

  - type: textarea
    attributes:
      label: What happened + What you expected to happen
      description: >
        Describe the bug, the expected behavior, and useful information such as logs.
      placeholder: >
        Explain what happened, what you expected, and why the behavior appears incorrect.
        Paste relevant error text rather than screenshots.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Versions / Dependencies
      description: >
        Specify the Tributo, Python, Ray, operating system, and other relevant dependency versions.
      placeholder: List the versions and environment details needed to reproduce the problem.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Reproduction script
      description: >
        Provide a narrow, reproducible script or command sequence. A minimal example makes the
        issue easier to investigate.
      placeholder: Include any setup steps or fixtures needed to reproduce the issue.
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Issue Severity
      description: How does this issue affect your experience as a Tributo user?
      multiple: false
      options:
        - "Low: It annoys or frustrates me."
        - "Medium: It is a significant difficulty but I can work around it."
        - "High: It blocks me from completing my task."
    validations:
      required: false
