x-ray-common: &ray-common
  image: ${TRIBUTO_IT_RUNTIME_IMAGE:?TRIBUTO_IT_RUNTIME_IMAGE is required}
  pull_policy: never
  init: true
  shm_size: 2gb
  working_dir: /workspace/tributo-src
  environment:
    AWS_ACCESS_KEY_ID: minioadmin
    AWS_SECRET_ACCESS_KEY: minioadmin123
    AWS_DEFAULT_REGION: us-east-1
    AWS_ENDPOINT_URL: http://minio:9000
    AWS_ENDPOINT_URL_S3: http://minio:9000
    PYTHONDONTWRITEBYTECODE: "1"
    PYTHONPATH: /workspace/tributo-src/src:/workspace/tributo-src
    RAY_ACCEL_ENV_VAR_OVERRIDE_ON_ZERO: "0"
    TMPDIR: /workspace/tributo-work/tmp
    TRIBUTO_MINIO_ENDPOINT: http://minio:9000
    TRIBUTO_MINIO_ACCESS_KEY: minioadmin
    TRIBUTO_MINIO_SECRET_KEY: minioadmin123
    TRIBUTO_SOURCE_SNAPSHOT_PATH: /workspace/tributo-src
    XDG_CACHE_HOME: /workspace/tributo-work/cache
    TRIBUTO_RAY_DASHBOARD_URL: http://127.0.0.1:8265
    TRIBUTO_RAY_MINIO_ENDPOINT: http://minio:9000
    TRIBUTO_HIVE_HOST: hiveserver2
    TRIBUTO_HIVE_PORT: "10000"
    TRIBUTO_POSTGRESQL_HOST: postgres
    TRIBUTO_POSTGRESQL_PORT: "5432"
    TRIBUTO_POSTGRESQL_DB: tributo
    TRIBUTO_POSTGRESQL_USER: tributo
    TRIBUTO_POSTGRESQL_PASSWORD: tributo-test
    JAVA_HOME: /opt/java/openjdk
    HADOOP_HOME: /opt/hadoop
    HADOOP_USER_NAME: ray
    TRIBUTO_HDFS_DATA_PROXY_HOST: hdfs
    TRIBUTO_HDFS_WEB_PORT: "9870"
    ARROW_LIBHDFS_DIR: /opt/hadoop/lib/native
    HADOOP_CONF_DIR: /workspace/tributo-src/tests/integrations/hdfs
    LD_LIBRARY_PATH: /opt/hadoop/lib/native:/opt/java/openjdk/lib/server
    CLASSPATH: /opt/hadoop/etc/hadoop:/opt/hadoop/share/hadoop/common/*:/opt/hadoop/share/hadoop/common/lib/*:/opt/hadoop/share/hadoop/hdfs/*:/opt/hadoop/share/hadoop/hdfs/lib/*:/opt/hadoop/share/hadoop/yarn/*:/opt/hadoop/share/hadoop/yarn/lib/*:/opt/hadoop/share/hadoop/mapreduce/*:/opt/hadoop/share/hadoop/mapreduce/lib/*
    TRIBUTO_STORAGE_PROFILE_VECTOR_IT: '{"endpoint":"http://minio:9000","region":"us-east-1","access_key_id":"minioadmin","secret_access_key":"minioadmin123","use_ssl":false,"path_style":true}'
    MLFLOW_TRACKING_URI: http://mlflow:5000
    PYTHON_VERSION: ${PYTHON_VERSION}
    RAY_VERSION: ${RAY_VERSION}
    MLFLOW_VERSION: ${MLFLOW_VERSION}
    BOTO3_VERSION: ${BOTO3_VERSION}
    BOTOCORE_VERSION: ${BOTOCORE_VERSION}
    XGBOOST_VERSION: ${XGBOOST_VERSION}
    ONNX_VERSION: ${ONNX_VERSION}
    ONNXRUNTIME_VERSION: ${ONNXRUNTIME_VERSION}
    ONNXMLTOOLS_VERSION: ${ONNXMLTOOLS_VERSION}
    TORCH_VERSION: ${TORCH_VERSION}
    TRANSFORMERS_VERSION: ${TRANSFORMERS_VERSION}
    PYARROW_VERSION: ${PYARROW_VERSION}
    PANDAS_VERSION: ${PANDAS_VERSION}
  volumes:
    - ingestion-source:/workspace/tributo-src:ro
    - ingestion-workspace:/workspace/tributo-work

services:
  source-init:
    image: ${TRIBUTO_IT_RUNTIME_IMAGE:?TRIBUTO_IT_RUNTIME_IMAGE is required}
    pull_policy: never
    user: "0:0"
    entrypoint:
      - python
    command:
      - /host-source/tools/tributo_it.py
      - create-source-snapshot
      - --source
      - /host-source
      - --destination
      - /snapshot
      - --owner-uid
      - "1000"
      - --owner-gid
      - "100"
    volumes:
      - ${TRIBUTO_IT_SOURCE_ROOT:?TRIBUTO_IT_SOURCE_ROOT is required}:/host-source:ro
      - ingestion-source:/snapshot
    restart: "no"

  workspace-init:
    image: ${TRIBUTO_IT_RUNTIME_IMAGE:?TRIBUTO_IT_RUNTIME_IMAGE is required}
    pull_policy: never
    user: "0:0"
    entrypoint:
      - python
    command:
      - -c
      - >-
        import os, pathlib;
        root = pathlib.Path('/workspace/tributo-work');
        [(root / name).mkdir(parents=True, exist_ok=True) for name in ('cache', 'tmp')];
        [os.chown(path, 1000, 100) for path in (root, root / 'cache', root / 'tmp')]
    volumes:
      - ingestion-workspace:/workspace/tributo-work
    restart: "no"

  ray-head:
    <<: *ray-common
    command:
      - ray
      - start
      - --head
      - --port=6379
      - --dashboard-host=0.0.0.0
      - --num-cpus=${TRIBUTO_IT_RAY_HEAD_CPUS:-1}
      - --block
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          urllib.request.urlopen('http://minio:9000/minio/health/live', timeout=2).read()"
          >/dev/null 2>&1 &&
          ray status --address=127.0.0.1:6379 >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    depends_on:
      minio:
        condition: service_started
      source-init:
        condition: service_completed_successfully
      workspace-init:
        condition: service_completed_successfully

  ray-worker:
    <<: *ray-common
    command:
      - ray
      - start
      - --address=ray-head:6379
      - --num-cpus=2
      - --block
    depends_on:
      ray-head:
        condition: service_healthy
      source-init:
        condition: service_completed_successfully
      workspace-init:
        condition: service_completed_successfully

  minio:
    image: ${TRIBUTO_IT_MINIO_IMAGE:?TRIBUTO_IT_MINIO_IMAGE is required}
    pull_policy: never
    command:
      - server
      - /data
      - --console-address
      - :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123

  hdfs:
    image: ${TRIBUTO_IT_HDFS_IMAGE:-tributo-hdfs-disabled:local}
    pull_policy: never
    profiles: ["hdfs-ingestion"]
    user: "0:0"
    environment:
      JAVA_HOME: /opt/java/openjdk
      HADOOP_HOME: /opt/hadoop
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
      HADOOP_PID_DIR: /tmp/hadoop-pid
      HADOOP_LOG_DIR: /tmp/hadoop-log
      CLASSPATH: /opt/hadoop:/opt/hadoop/etc/hadoop:/opt/hadoop/share/hadoop/common/*:/opt/hadoop/share/hadoop/common/lib/*:/opt/hadoop/share/hadoop/hdfs/*:/opt/hadoop/share/hadoop/hdfs/lib/*:/opt/hadoop/share/hadoop/yarn/*:/opt/hadoop/share/hadoop/yarn/lib/*:/opt/hadoop/share/hadoop/mapreduce/*:/opt/hadoop/share/hadoop/mapreduce/lib/*
    entrypoint:
      - /bin/bash
      - -lc
    command:
      - >-
        set -eu;
        export JAVA_HOME=/opt/java/openjdk HADOOP_HOME=/opt/hadoop
        HADOOP_CONF_DIR=/opt/hadoop/etc/hadoop;
        mkdir -p /opt/hadoop/webapps/hdfs /opt/hadoop/webapps/datanode;
        cp /workspace/tributo-src/tests/integrations/hdfs/core-site.xml "$$HADOOP_CONF_DIR/core-site.xml";
        cp /workspace/tributo-src/tests/integrations/hdfs/hdfs-site.xml "$$HADOOP_CONF_DIR/hdfs-site.xml";
        HADOOP_PID_DIR=/tmp/hadoop-pid HADOOP_LOG_DIR=/tmp/hadoop-log;
        mkdir -p "$$HADOOP_PID_DIR" "$$HADOOP_LOG_DIR";
        if [ ! -f /data/name/current/VERSION ]; then
        hdfs namenode -format -force -nonInteractive; fi;
        HADOOP_RUNTIME_CLASSPATH="/opt/hadoop:$$(hadoop classpath --glob)";
        mkdir -p /tmp/hadoop-log;
        java --add-opens=java.base/java.lang=ALL-UNNAMED -cp "$$HADOOP_RUNTIME_CLASSPATH" -Dproc_namenode -Djava.net.preferIPv4Stack=true -Djava.library.path=/opt/hadoop/lib/native org.apache.hadoop.hdfs.server.namenode.NameNode >/tmp/hadoop-log/namenode.out 2>&1 & namenode_pid=$$!;
        java --add-opens=java.base/java.lang=ALL-UNNAMED -cp "$$HADOOP_RUNTIME_CLASSPATH" -Dproc_datanode -Djava.net.preferIPv4Stack=true -Djava.library.path=/opt/hadoop/lib/native org.apache.hadoop.hdfs.server.datanode.DataNode >/tmp/hadoop-log/datanode.out 2>&1 & datanode_pid=$$!;
        trap 'kill "$$namenode_pid" "$$datanode_pid" 2>/dev/null || true' INT TERM EXIT;
        until hdfs dfs -mkdir -p /tributo-hdfs; do sleep 1; done;
        hdfs dfs -chmod -R 777 /tributo-hdfs;
        tail -f /dev/null
    volumes:
      - ingestion-source:/workspace/tributo-src:ro
      - hdfs-name-data:/data/name
      - hdfs-data-data:/data/data
    depends_on:
      source-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          export JAVA_HOME=/opt/java/openjdk HADOOP_HOME=/opt/hadoop
          HADOOP_CONF_DIR=/workspace/tributo-src/tests/integrations/hdfs;
          hdfs dfs -test -d /tributo-hdfs
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 15s

  hdfs-init:
    <<: *ray-common
    profiles: ["hdfs-ingestion"]
    entrypoint:
      - /bin/bash
      - -lc
    command:
      - >-
        set -eu;
        cp /workspace/tributo-src/tests/integrations/hdfs/core-site.xml /opt/hadoop/etc/hadoop/core-site.xml;
        cp /workspace/tributo-src/tests/integrations/hdfs/hdfs-site.xml /opt/hadoop/etc/hadoop/hdfs-site.xml;
        export HADOOP_CONF_DIR=/opt/hadoop/etc/hadoop;
        exec python /workspace/tributo-src/tests/integrations/setup_hdfs_fixture.py
    environment:
      TRIBUTO_HDFS_HOST: hdfs
      TRIBUTO_HDFS_PORT: "8020"
    depends_on:
      hdfs:
        condition: service_healthy
      source-init:
        condition: service_completed_successfully
      workspace-init:
        condition: service_completed_successfully
    restart: "no"

  postgres:
    image: ${TRIBUTO_IT_POSTGRES_IMAGE:-postgres:16.14}
    pull_policy: never
    profiles: ["postgres-ingestion"]
    environment:
      POSTGRES_DB: tributo
      POSTGRES_USER: tributo
      POSTGRES_PASSWORD: tributo-test
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U tributo -d tributo
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 5s

  postgres-test:
    <<: *ray-common
    profiles: ["postgres-ingestion"]
    command:
      - python
      - -m
      - pytest
      - tests/integration/test_postgresql_ingestion.py
      - -o
      - addopts=
      - -m
      - integration
      - -vv
      - -rP
      - --tb=short
      - --timeout=1200
    depends_on:
      postgres:
        condition: service_healthy
      source-init:
        condition: service_completed_successfully
      workspace-init:
        condition: service_completed_successfully
    restart: "no"

  hiveserver2:
    image: ${TRIBUTO_IT_HIVE_IMAGE:-tributo-hive-disabled:local}
    pull_policy: never
    profiles: ["hive-ingestion"]
    environment:
      SERVICE_NAME: hiveserver2
      SERVICE_OPTS: >-
        -Dhive.server2.authentication=NOSASL
        -Dhive.server2.thrift.resultset.serialize.in.tasks=false
        -Dhive.exec.mode.local.auto=true
        -Dhive.execution.engine=mr
    volumes:
      - hive-warehouse:/opt/hive/data/warehouse
    healthcheck:
      test:
        - CMD-SHELL
        - bash -c '</dev/tcp/127.0.0.1/10000'
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 30s

  hive-init:
    <<: *ray-common
    profiles: ["hive-ingestion"]
    entrypoint:
      - python
    command:
      - /workspace/tributo-src/tests/integrations/setup_hive_fixture.py
      - /workspace/tributo-src/tests/integrations/hive-setup.sql
      - --host
      - hiveserver2
      - --port
      - "10000"
    depends_on:
      hiveserver2:
        condition: service_healthy
      source-init:
        condition: service_completed_successfully
    restart: "no"

  mlflow:
    <<: *ray-common
    profiles: ["model-export"]
    command:
      - mlflow
      - server
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --artifacts-destination
      - /mlflow/artifacts
      - --host
      - 0.0.0.0
      - --port
      - "5000"
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2).read()"
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    depends_on:
      mlflow-init:
        condition: service_completed_successfully

  mlflow-init:
    <<: *ray-common
    profiles: ["model-export"]
    user: root
    command:
      - chown
      - ray:users
      - /mlflow
    restart: "no"
    volumes:
      - mlflow-data:/mlflow

volumes:
  hive-warehouse:
  ingestion-source:
  ingestion-workspace:
  mlflow-data:
  postgres-data:
  hdfs-name-data:
  hdfs-data-data:
